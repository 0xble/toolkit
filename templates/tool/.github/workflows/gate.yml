name: gate
# From github.com/0xble/toolkit templates/tool. The exact-SHA gate and its
# draft policy live in the reusable workflow, pinned by tag.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: 0xble/toolkit/.github/workflows/tool-gate.yml@v0.1.1

  # The required check. A called workflow's jobs are reported as
  # "gate / ...", so this job carries the plain `qualification` name.
  qualification:
    runs-on: ubuntu-slim
    needs: [gate]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require the reusable gate
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          printf 'reusable gate: %s\n' "$GATE_RESULT"
          [ "$GATE_RESULT" = success ] || { echo 'gate not qualified' >&2; exit 1; }
          echo 'gate qualified'
