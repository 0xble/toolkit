name: gate
# toolkit runs the same reusable gate it publishes for tools, by local path,
# so a change to tool-gate.yml is proven by its own pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # PRs use base ci/. Exercise reviewed image/workflow changes after landing.
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: ./.github/workflows/tool-gate.yml
    with:
      go-version-file: .github/go-version

  # The required check. A called workflow's jobs are reported as
  # "gate / ...", so this job carries the plain `qualification` name.
  qualification:
    runs-on: ubuntu-slim
    needs: [gate]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require the reusable gate
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          printf 'reusable gate: %s\n' "$GATE_RESULT"
          [ "$GATE_RESULT" = success ] || { echo 'gate not qualified' >&2; exit 1; }
          echo 'gate qualified'
