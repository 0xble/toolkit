name: gate
# toolkit runs the same reusable gate it publishes for tools, by local path,
# so a change to tool-gate.yml is proven by its own pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # PRs use base ci/. Exercise reviewed image/workflow changes after landing.
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: ./.github/workflows/tool-gate.yml
    with:
      ci-image-dir: ci
      caller-qualification: true

  # The required check. A called workflow's jobs are reported as
  # "gate / ...", so this job carries the plain `qualification` name.
  qualification:
    runs-on: ubuntu-slim
    needs: [gate]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require the reusable gate
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          LANE_RESULT: ${{ needs.gate.outputs.lane-result }}
        run: |
          set -euo pipefail
          printf 'reusable gate: %s\n' "$GATE_RESULT"
          [ "$GATE_RESULT" = success ] || { echo 'gate not qualified' >&2; exit 1; }
          # A reusable workflow with only skipped jobs can report success.
          # Require its actual exact-SHA lane too; missing output fails closed.
          printf 'blocking lane gate: %s\n' "$LANE_RESULT"
          [ "$LANE_RESULT" = success ] || { echo 'gate not qualified' >&2; exit 1; }
          echo 'gate qualified'
